name: Docker Build+Publish

on:
  pull_request:
  push:
    branches:
      - '**'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log In to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set architecture tag
        id: image
        if: github.event_name == 'push'
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          ARCH: ${{ matrix.arch }}
        run: echo "tag=ghcr.io/${REPOSITORY,,}:sha-$COMMIT-$ARCH" >> "$GITHUB_OUTPUT"
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.image.outputs.tag }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=toolbox-${{ matrix.arch }}
          cache-to: type=gha,scope=toolbox-${{ matrix.arch }},mode=max

  publish-manifest:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture tags
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          tags=(-t "$image:sha-$COMMIT")
          if [ "$REF" = 'refs/heads/main' ]; then
            tags+=(-t "$image:main")
          fi
          docker buildx imagetools create "${tags[@]}" \
            "$image:sha-$COMMIT-amd64" "$image:sha-$COMMIT-arm64"
